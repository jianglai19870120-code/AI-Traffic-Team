interface:
  display_name: "干货型文案生成Skill"
  short_description: "读取干货型手动选题，组合调用误区、两组三步模块和金句，只生成一条正文主线方案"
  default_prompt: "使用 干货型文案生成Skill。读取 02_资产中心/04_爆款选题库/00_手动输入选题表.md 中 文案结构=干货型 的选题，或使用我明确给出的选题。本 Skill 不生成开头、不读取爆款开头库。只生成一条主线和一张四列表，字段为：序号、逻辑关系、选用模块、对应来源。固定 11 行：误区1、误区2、过渡句、步骤1、步骤2、步骤3、过渡句、步骤1、步骤2、步骤3、金句收口。误区和步骤允许跨书、跨模块组合匹配，但必须服从主线逻辑；第一组步骤共同解决一个问题，第二组步骤共同解决另一个问题，两组问题之间必须递进；两条过渡句来源留空。保存到 02_资产中心/06_生成正文库/01_干货型文案，文件名和H1都使用 选题_生成时间；生成成功后回写手动输入选题表的生成时间和生成状态=已生成。"
