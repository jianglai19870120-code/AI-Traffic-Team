interface:
  display_name: "爆款开头成稿生成Skill"
  short_description: "读取正文方案并按 BK 开头卡片规则匹配开头，生成最终口播成稿"
  default_prompt: "使用 爆款开头成稿生成Skill。读取 02_资产中心/04_爆款选题库/00_手动输入选题表.md 中已完成正文方案的选题，先按 文案结构 路由到 02_资产中心/06_生成正文库 找到该选题最新一版正文方案，再去 02_资产中心/05_爆款开头库 按 适合承载的论证方式 和 调用匹配规则 选中最适合的 BK 卡片。最后在不改变开头结构和正文逻辑结构的前提下，把它们一起润色成笃定、口播化、口语化的最终成稿，并保存到 02_资产中心/07_润色成稿库/01_干货型成稿，同时回写 成稿时间 和 成稿状态=已生成。"
